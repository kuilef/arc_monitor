services:
  demo:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ARC_DB: /app/data/demo.db
      ARC_MODE: demo
    volumes:
      - arc_data:/app/data
    command: ["sh", "-c", "python -m arc_monitor --db /app/data/demo.db --mode demo demo && exec python -m uvicorn arc_monitor.app:app_from_env --factory --host 0.0.0.0 --port 8000"]
volumes:
  arc_data:
