[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arc-monitor"
version = "0.1.0"
description = "Read-only Arc launch research and monitoring with explicit data quality"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.8,<3", "SQLAlchemy>=2.0,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.11,<1", "build>=1,<2"]
postgres = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
arc-monitor = "arc_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arc_monitor = ["web/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
